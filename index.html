<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3b2418" />
  <meta name="description" content="A personal coffee journal for cafés, home brews and espresso beans." />
  <title>Bean Diary — Coffee Journal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-bar">
    <h1>☕ Bean Diary</h1>
    <button id="install-btn" class="install-btn" hidden>Install</button>
  </header>

  <main>
    <!-- Summary stats -->
    <section id="stats" class="stats" aria-label="Summary">
      <div class="stat"><span id="stat-count" class="stat-num">0</span><span class="stat-label">entries</span></div>
      <div class="stat"><span id="stat-avg" class="stat-num">–</span><span class="stat-label">avg rating</span></div>
      <div class="stat"><span id="stat-fav" class="stat-num">–</span><span class="stat-label">top method</span></div>
    </section>

    <!-- Search / filter -->
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search beans, café, roaster…" autocomplete="off" />
      <select id="filter-type" aria-label="Filter by type">
        <option value="">All</option>
        <option value="cafe">Café</option>
        <option value="home">Home brew</option>
      </select>
    </div>

    <!-- Entry list -->
    <ul id="list" class="entry-list" aria-live="polite"></ul>
    <p id="empty" class="empty">No entries yet. Tap <strong>+</strong> to log your first cup.</p>
  </main>

  <button id="add-btn" class="fab" aria-label="Add entry">＋</button>

  <!-- Entry form (modal) -->
  <div id="modal" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="form-title">New entry</h2>
        <button id="close-btn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <form id="entry-form">
        <input type="hidden" id="entry-id" />

        <label>Type
          <div class="seg" role="radiogroup">
            <input type="radio" name="type" id="type-cafe" value="cafe" checked />
            <label for="type-cafe">Café</label>
            <input type="radio" name="type" id="type-home" value="home" />
            <label for="type-home">Home brew</label>
          </div>
        </label>

        <label>Bean / blend name
          <input id="f-bean" type="text" placeholder="e.g. Ethiopia Guji" required />
        </label>

        <label>Roaster
          <input id="f-roaster" type="text" placeholder="e.g. Onyx Coffee Lab" />
        </label>

        <label id="cafe-field">Café
          <input id="f-cafe" type="text" placeholder="Where did you drink it?" />
        </label>

        <label>Origin
          <input id="f-origin" type="text" placeholder="Country / region" />
        </label>

        <div class="row">
          <label>Brew method
            <select id="f-method">
              <option value="Espresso">Espresso</option>
              <option value="Pour over">Pour over</option>
              <option value="Aeropress">Aeropress</option>
              <option value="French press">French press</option>
              <option value="Moka pot">Moka pot</option>
              <option value="Cold brew">Cold brew</option>
              <option value="Latte">Latte</option>
              <option value="Cappuccino">Cappuccino</option>
              <option value="Drip">Drip</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label>Roast
            <select id="f-roast">
              <option value="">–</option>
              <option value="Light">Light</option>
              <option value="Medium-light">Medium-light</option>
              <option value="Medium">Medium</option>
              <option value="Medium-dark">Medium-dark</option>
              <option value="Dark">Dark</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label>Price
            <input id="f-price" type="text" inputmode="decimal" placeholder="e.g. 18.50" />
          </label>
          <label>Date
            <input id="f-date" type="date" />
          </label>
        </div>

        <label>Rating
          <div class="stars" id="f-stars" role="slider" aria-label="Rating" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" tabindex="0">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </label>

        <label>Tasting notes
          <textarea id="f-notes" rows="3" placeholder="Flavours, aroma, what you'd change…"></textarea>
        </label>

        <div class="form-actions">
          <button type="button" id="delete-btn" class="btn-danger" hidden>Delete</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
